<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مخزني - إدارة المخزون</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2349d6">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14202c;--mut:#5a6b7c;--pri:#2349d6;--on:#fff;--line:#d9e0e8;--warn:#b93c0a;--warnbg:#fdeee6;--ok:#157a3c;--okbg:#e5f5ea;--err:#b91c1c;--errbg:#fde8e8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18232f;--ink:#e8eef4;--mut:#93a4b5;--pri:#7c9bff;--on:#0f1720;--line:#2b3a4a;--warn:#ffa26b;--warnbg:#3a2417;--ok:#6fd194;--okbg:#14301f;--err:#ff8f8f;--errbg:#3a1a1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18232f;--ink:#e8eef4;--mut:#93a4b5;--pri:#7c9bff;--on:#0f1720;--line:#2b3a4a;--warn:#ffa26b;--warnbg:#3a2417;--ok:#6fd194;--okbg:#14301f;--err:#ff8f8f;--errbg:#3a1a1a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.6;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;max-width:760px;margin:0 auto}
h1{font-size:22px;font-weight:800;margin:0}
h2{font-size:17px;margin:20px 0 8px}
main{max-width:760px;margin:0 auto;padding:0 16px 16px}
select,input,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
header select{width:auto}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.btn{border:0;background:var(--pri);color:var(--on);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.full{width:100%;padding:13px;font-size:17px;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.row .g{flex:1;min-width:160px}
.row b{display:block;overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:13px;font-weight:600}
.t-warn{background:var(--warnbg);color:var(--warn)}.t-err{background:var(--errbg);color:var(--err)}.t-ok{background:var(--okbg);color:var(--ok)}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 4px}
.empty{padding:22px 12px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:8px}
.stat{display:flex;gap:10px}.stat>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}.stat b{font-size:22px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 4px;font-weight:600;color:var(--mut);cursor:pointer;position:relative}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
nav i{position:absolute;top:6px;margin-inline-start:4px;background:var(--err);color:#fff;font-style:normal;font-size:12px;border-radius:10px;padding:0 6px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.acts .btn{flex:1;min-width:100px}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:24px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#rc{border:1px dashed var(--line);border-radius:8px;padding:12px;margin:10px 0}#rc h2{margin:0 0 4px;text-align:center}#rc .ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0}#rc .tt{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:800}

.bc-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.bc-label{border:1px dashed #999;border-radius:4px;padding:6px 8px;text-align:center;background:#fff;color:#000;width:48mm;page-break-inside:avoid}
.bc-label .b-shop{font-size:10px;font-weight:700;margin-bottom:1px}
.bc-label .b-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-label .b-price{font-size:12px;font-weight:800;margin-top:1px}
.bc-label svg{max-width:100%;height:38px;display:block;margin:2px auto}

.park-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.park-chip{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

@media print{
  body>*:not(#dlg){display:none!important}
  #dlg{position:static;border:0;width:100%;max-width:none;padding:0;color:#000;background:#fff;margin:0}
  #dlg::backdrop{display:none}
  #dlg .noprint{display:none!important}
  #rc{border:0;color:#000;width:80mm;margin:0 auto}
  .bc-label{border:1px solid #eee}
}
body.cashier .own{display:none!important}.sub{padding:10px 12px;border-radius:8px;margin:0 0 10px}
.badge-cashier{background:var(--warnbg);color:var(--warn);padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700;margin-inline-start:6px}
</style>
</head>
<body>
<header>
  <h1>📦 مخزني <span id="modeBadge"></span></h1>
  <button class="btn sec sm" onclick="fSet()">⚙ الإعدادات</button>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var S=null,tab='sell',cart=[],authMode='login';
var bluetoothDevice=null,printerCharacteristic=null;
var isDeviceLocked=false;
var parkedCarts=[];

S={mode:'pharmacy',products:[],sales:[],shop:'',cust:[],expenses:[]};
function save(){try{localStorage.setItem('mode',S.mode);localStorage.setItem('sname',S.shop||'')}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ph(){return S.mode==='pharmacy'}
function P(id){return S.products.find(function(p){return p.id===id})}
function toast(m){var t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},2600)}
function fmt(p,q){return p.spb>1?Math.floor(q/p.spb)+' علبة'+(q%p.spb?' + '+(q%p.spb)+' شريط':''):q+' قطعة'}
function money(n){return (Math.round(n*100)/100)+' ج.م'}
function days(p){return p.exp?Math.ceil((new Date(p.exp)-Date.now())/864e5):null}

/* صوت تنبيه خفيف للكاشير (Beep) */
function beep(ok){
 try{
  var ctx=new (window.AudioContext||window.webkitAudioContext)();
  var osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=ok?'sine':'sawtooth';
  osc.frequency.value=ok?880:220;
  gain.gain.setValueAtTime(0.08,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(ok?0.12:0.25));
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+(ok?0.12:0.25));
 }catch(e){}
}

function isEffectiveCashier(){
 return ROLE !== 'owner' || isDeviceLocked;
}

function applyRoleUI(){
 var c = isEffectiveCashier();
 document.body.className = c ? 'cashier' : '';
 $('#modeBadge').innerHTML = isDeviceLocked ? '<span class="badge-cashier">وضع الكاشير</span>' : '';
}

function alerts(){var a=[];S.products.forEach(function(p){
 var d=days(p);
 if(p.qty<=0)a.push({p:p,k:'err',t:'خلص من المخزون'});
 else if(p.qty<=p.min)a.push({p:p,k:'warn',t:'وصل للحد الأدنى (باقي '+fmt(p,p.qty)+')'});
 if(d!==null&&d<0)a.push({p:p,k:'err',t:'منتهي الصلاحية'});
 else if(d!==null&&d<=90)a.push({p:p,k:'warn',t:'ينتهي بعد '+d+' يوم'});
});return a}

function renderNav(){var n=alerts().length;
 var T=[['sell','بيع'],['stock','المخزون'],['alerts','تنبيهات'],['cust','العملاء'],['rep','تقارير']];
 $('#nav').innerHTML=T.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+(t[0]==='alerts'&&n?'<i>'+n+'</i>':'')+'</button>'}).join('')}

function go(t){tab=t;render()}
function render(){
  applyRoleUI();
  renderNav();
  var fn = {sell:vSell, stock:vStock, alerts:vAlerts, rep:vRep, cust:vCust}[tab];
  if(fn) fn();
  var si=subInfo();
  if(si.d<=3){
    $('#main').insertAdjacentHTML('afterbegin','<div class="sub '+(si.d<0?'t-err':'t-warn')+'">'+(si.d<0?'الاشتراك منتهي. تقدر تشوف بياناتك بس مش تبيع أو تعدّل.':'الاشتراك ينتهي بعد '+Math.max(si.d,0)+' يوم.')+'</div>');
  }
}

/* ---------- السحابة والتحقق الموحد ---------- */
var DB=supabase.createClient('https://tfsghjsczwvqadjklkkh.supabase.co','sb_publishable_wuYZOw3xaPr5kSkEtVpWdQ_tVy0-077'),SID=null,ROLE='cashier',SHOP=null;
function msg(e){var m=e.message||'';
 if(/subscription expired/.test(m))return 'الاشتراك منتهي. فعّل الاشتراك عشان تكمل.';
 if(/insufficient stock/.test(m))return 'الكمية المتاحة مش كفاية: '+m.split(': ')[1];
 if(/user not found/.test(m))return 'الإيميل ده مسجلش حساب لسه. اطلب منه يسجل الأول.';
 if(/row-level security/.test(m))return 'مش مسموح لك بالعملية دي، أو الاشتراك منتهي.';
 if(/fetch|network/i.test(m))return 'مفيش اتصال بالنت.';
 if(/customer required/.test(m))return 'اختار عميل لو مش هيدفع المبلغ كامل.';
 if(/invalid return/.test(m))return 'كمية المرتجع أكبر من المتاح للإرجاع.';
 if(/Invalid login/.test(m))return 'الإيميل أو كلمة السر غلط.';
 if(/already registered/.test(m))return 'الإيميل ده مسجل قبل كده. جرّب تسجيل الدخول.';
 if(/Password should/.test(m))return 'كلمة السر لازم تكون 6 حروف على الأقل.';
 return m}
function subInfo(){if(!SHOP)return{e:'',d:99};var e=[SHOP.trial_ends,SHOP.paid_until].filter(Boolean).sort().pop();return{e:e,d:Math.ceil((new Date(e)-Date.now())/864e5)}}

function vNew(){$('#nav').innerHTML='';$('#main').innerHTML='<h2>اسم المحل أو الصيدلية</h2><input id="sn0" placeholder="مثلاً: صيدلية الشفاء"><label>نوع النشاط (بتختاره مرة واحدة ومش بيتغيّر بعد كده)</label><select id="ty"><option value="pharmacy">صيدلية</option><option value="general">محل عام</option></select><div class="acts"><button class="btn" onclick="mkShop()">إنشاء وبدء التجربة المجانية</button></div><h2>أنا كاشير</h2><p class="mut">لو صاحب المحل ضافك بإيميلك، اضغط تحديث.</p><div class="acts"><button class="btn sec" onclick="boot()">تحديث</button><button class="btn sec" onclick="DB.auth.signOut().then(function(){location.reload()})">تسجيل خروج</button></div>'}
async function mkShop(){var n=$('#sn0').value.trim();if(!n)return toast('اكتب اسم المحل');var r=await DB.rpc('create_shop',{p_name:n,p_type:$('#ty').value});if(r.error)return toast(msg(r.error));boot()}

function vAuth(){
 $('#nav').innerHTML='';document.body.className='';$('#modeBadge').innerHTML='';
 $('#main').innerHTML='<div style="max-width:440px;margin:20px auto;background:var(--card);padding:20px;border:1px solid var(--line);border-radius:12px;">'
  +'<div style="display:flex;gap:8px;margin-bottom:16px;">'
    +'<button class="btn '+(authMode==='login'?'':'sec')+'" style="flex:1" onclick="authMode=\'login\';vAuth()">تسجيل الدخول</button>'
    +'<button class="btn '+(authMode==='signup'?'':'sec')+'" style="flex:1" onclick="authMode=\'signup\';vAuth()">حساب ومحل جديد</button>'
  +'</div>'
  +'<h2 style="margin-top:0;font-size:19px;">'+(authMode==='login'?'تسجيل الدخول إلى حسابك':'إنشاء حساب ومحل جديد')+'</h2>'
  +'<label>الإيميل</label><input id="em" type="email" autocomplete="username" placeholder="name@example.com">'
  +'<label>كلمة السر</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">'
  +(authMode==='signup'?'<div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;"><label>اسم المحل أو الصيدلية</label><input id="sn0" placeholder="مثلاً: صيدلية الشفاء"><label>نوع النشاط (بتختاره مرة واحدة ومش بيتغيّر بعد كده)</label><select id="ty"><option value="pharmacy">صيدلية</option><option value="general">محل عام</option></select></div>':'')
  +'<div class="acts" style="margin-top:20px;"><button class="btn full" onclick="submitAuth()">'+(authMode==='login'?'دخول':'إنشاء وبدء التجربة المجانية')+'</button></div>'
  +(authMode==='login'?'<div style="margin-top:16px;text-align:center;border-top:1px solid var(--line);padding-top:12px;"><p class="mut" style="margin:0 0 6px;font-size:13px;">أنا كاشير ومضاف مسبقاً؟</p><button class="btn sec sm" onclick="boot()">تحديث بيانات الدخول</button></div>':'')
  +'</div>';
}

async function submitAuth(){
 var email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||!password)return toast('من فضلك اكتب الإيميل وكلمة السر');
 if(authMode==='login'){
  var r=await DB.auth.signInWithPassword({email:email,password:password});
  if(r.error)return toast(msg(r.error));
  boot();
 }else{
  var shopName=$('#sn0').value.trim(),shopType=$('#ty').value;
  if(!shopName)return toast('اكتب اسم المحل أو الصيدلية');
  var r=await DB.auth.signUp({email:email,password:password});
  if(r.error)return toast(msg(r.error));
  if(r.data.session){
   var r2=await DB.rpc('create_shop',{p_name:shopName,p_type:shopType});
   if(r2.error)return toast(msg(r2.error));
   boot();
  }else{
   toast('اتبعتلك إيميل تأكيد. افتحه وبعدين سجل دخول.');
  }
 }
}

/* لاحظ أننا لم نعد نجلب owner_pin إلى المتصفح لزيادة الأمان */
async function boot(){var u=await DB.auth.getSession();if(!u.data.session)return vAuth();
 var m=await DB.from('members').select('shop_id,role,shops(name,type,trial_ends,paid_until,cashier_refund_limit)').limit(1);
 if(m.error)return toast(msg(m.error));
 if(!m.data.length)return vNew();
 SID=m.data[0].shop_id;ROLE=m.data[0].role;SHOP=m.data[0].shops;
 isDeviceLocked=(localStorage.getItem('cashier_lock_'+SID)==='1');
 try{S.mode=SHOP.type||'pharmacy';S.shop=localStorage.getItem('sname')||SHOP.name}catch(e){S.shop=SHOP.name}
 await load();render();syncOfflineSales()}

async function load(){
 var a=await DB.from('products').select('*').eq('shop_id',SID).order('created_at'),
     b=await DB.from('sales').select('id,number,total,paid,refunded,customer_id,created_at,sale_items(id,product_id,name,qty,unit,returned,line_total)').eq('shop_id',SID).order('created_at',{ascending:false}).limit(500),
     e=await DB.from('expenses').select('*').eq('shop_id',SID).order('created_at',{ascending:false});
 if(a.error||b.error)return toast(msg(a.error||b.error));
 S.products=a.data.map(function(r,i){return{id:i+1,uid:r.id,name:r.name,code:r.code||'',price:+r.price,cost:+(r.cost_price||0),qty:r.qty,min:r.min_qty,spb:r.units_per_box,exp:r.expiry||'',sold:r.sold,last:r.last_sold_at?Date.parse(r.last_sold_at):0,c:Date.parse(r.created_at)}});
 S.sales=b.data.reverse().map(function(r){return{id:r.id,no:r.number,t:Date.parse(r.created_at),tot:+r.total,paid:+r.paid,refunded:+r.refunded,cid:r.customer_id,items:r.sale_items.map(function(i){return{iid:i.id,pid:i.product_id,n:i.name,q:i.qty,u:i.unit,rt:i.returned,v:+i.line_total}})}});
 S.expenses=e.data||[];
 var c=await DB.from('customers').select('*').eq('shop_id',SID).order('name');S.cust=c.data||[]}

function lockCashierMode(){
 localStorage.setItem('cashier_lock_'+SID,'1');
 isDeviceLocked=true;
 $('#dlg').close();
 render();
 toast('تم قفل الجهاز على وضع الكاشير 🔒');
}

async function unlockCashierMode(){
 var entered=prompt('أدخل كود المالك السري (PIN) للرجوع لصلاحيات المالك:');
 if(entered===null)return;
 var r=await DB.rpc('verify_owner_pin',{p_shop:SID,p_pin:entered.trim()});
 if(r.error)return toast(msg(r.error));
 if(r.data===true){
  localStorage.removeItem('cashier_lock_'+SID);
  isDeviceLocked=false;
  $('#dlg').close();
  render();
  toast('تم فتح صلاحيات المالك بنجاح 🔓');
 }else{
  beep(false);
  toast('كود الـ PIN غير صحيح');
 }
}

function fSet(){var si=subInfo(),d=$('#dlg');
 var isCash=isEffectiveCashier();
 d.innerHTML='<h2 style="margin-top:0">'+esc(SHOP.name)+'</h2><p class="mut">الاشتراك لحد '+si.e+' ('+(SHOP.paid_until?'مدفوع':'تجربة مجانية')+')</p>'
 +(!isCash?'<div style="background:var(--bg);padding:12px;border-radius:8px;margin-bottom:12px;border:1px solid var(--line);">'
   +'<b style="font-size:15px;">إعدادات الكاشير والأمان</b>'
   +'<label>كود المالك السري الجديد (PIN - 4 أرقام)</label><input id="shop_pin" type="password" maxlength="4" placeholder="اكتب كود جديد أو اتركه فارغاً">'
   +'<label>سقف المرتجع الفوري للكاشير بدون PIN (ج.م)</label><input id="shop_limit" type="number" step="1" min="0" value="'+(SHOP.cashier_refund_limit!==null?SHOP.cashier_refund_limit:200)+'">'
   +'<div class="acts" style="margin-top:10px;"><button class="btn sm" onclick="updateShopPin()">حفظ الإعدادات</button><button class="btn sec sm" onclick="lockCashierMode()">🔒 قفل كوضع كاشير</button></div>'
  +'</div>':'')
 +(isDeviceLocked?'<div style="background:var(--warnbg);padding:12px;border-radius:8px;margin-bottom:12px;"><p style="margin:0 0 8px;font-size:14px;color:var(--warn);">الجهاز مقفول حالياً على وضع الكاشير.</p><button class="btn sm" onclick="unlockCashierMode()">🔓 فتح وضع المالك (يتطلب PIN)</button></div>':'')
 +(!isCash?'<label>إضافة كاشير بحساب مستقل (اختياري)</label><input id="ce" type="email" placeholder="email@example.com"><div class="acts"><button class="btn" onclick="addCash()">إضافة</button></div>':'')
 +(!isCash?'<div class="acts"><button class="btn sec" onclick="csv(0)">تصدير المخزون</button><button class="btn sec" onclick="csv(1)">تصدير المبيعات</button></div>':'')
 +'<div class="acts">'+(!isDeviceLocked?'<button class="btn sec" onclick="DB.auth.signOut().then(function(){location.reload()})">تسجيل خروج</button>':'')+'<button class="btn sec" onclick="$(\'#dlg\').close()">إغلاق</button></div>';

async function scan(){

    var d=$('#dlg');

    var st, bd;

        st = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        var v = $('#vd');

        await v.play();

        d.close();

    }

    (async function loop(){
        if(window.cam !== st) return;
        try {
            var r = await bd.detect($('#vd'));
            if(r.length){
                var c = r[0].rawValue, p = S.products.find(function(x){return x.code === c});
                d.close();
                if(p){ 
                    addCart(p.id); 
                    beep(true);
                    toast('تمت إضافة ' + p.name); 
                } else { 
                    beep(false);
                    toast('الباركود ده مش مسجل: ' + c); 
                }
                return;
            }
        } catch(e) {}
        setTimeout(loop, 300);
    })();
}

 });
 if(!L.length)return toast('حدد كمية المرتجع');

 var pin=window.enteredPin||null;
 var limit=(SHOP.cashier_refund_limit!==null&&SHOP.cashier_refund_limit!==undefined)?+SHOP.cashier_refund_limit:200;

 if(isEffectiveCashier() && (totalRefundVal > limit || isOld) && !pin){

   beep(false);

  }
  pin=pinInput.trim();
 }

 var r=await DB.rpc('refund_sale',{p_shop:SID,p_sale:sid,p_lines:L,p_pin:pin});
 if(r.error){
  if(/يتطلب إدخال كود المالك/.test(r.error.message)){
   var pinInput2=prompt('⚠️ يتطلب إدخال كود المالك السري (PIN):');
   if(pinInput2!==null){
    window.enteredPin=pinInput2.trim();
    return doRet(sid,saleTime);
   }
  }else{
   toast(msg(r.error));
  }
  window.enteredPin=null;
  return;
 }

 window.enteredPin=null;
 $('#dlg').close();
 beep(true);
 toast(r.data>0?'تم المرتجع. المطلوب رده كاش: '+money(r.data):'تم المرتجع وخُصم من ديون العميل');

  var data=encoder.encode(esc);
  const chunkSize=512;
  for(let i=0;i<data.length;i+=chunkSize){
   await printerCharacteristic.writeValue(data.slice(i,i+chunkSize));
  }
  toast('تمت الطباعة بنجاح');
 }catch(e){
  console.error(e);
  toast('حدث خطأ أثناء الطباعة، تأكد من تشغيل الطابعة');
  printerCharacteristic=null;
 }
}

 d.innerHTML='<div id="rc">'+rcHtml(s)+'</div>'
 +'<div class="noprint">'
  +'<label>اسم المحل (يظهر في الفاتورة)</label><input id="sn" value="'+esc(S.shop||'')+'">'
  +'<label>موبايل الزبون للواتساب (اختياري)</label><input id="ph" type="tel" inputmode="tel" placeholder="01012345678">'
  +'<div class="acts">'
    +'<button class="btn" onclick="printBT('+t+')">طباعة بلوتوث 🖨️</button>'
    +'<button class="btn sec" onclick="window.print()">طباعة عادية</button>'
    +'<button class="btn" onclick="wa('+t+')">واتساب</button>'
    +'<button class="btn sec" onclick="fRet('+t+')">مرتجع</button>'

 +'</div>';

function wa(t){var s=saleOf(t),n=$('#ph').value.replace(/\D/g,'');
 if(n.charAt(0)==='0')n='20'+n.slice(1);
 var w=null;try{w=window.open('https://wa.me/'+n+'?text='+encodeURIComponent(rcText(s)),'_blank')}catch(e){}
 if(!w){try{navigator.clipboard.writeText(rcText(s));toast('تم نسخ نص الفاتورة، الصقه في واتساب')}catch(e){toast('تعذر فتح واتساب')}}}

/* ---------- المخزون وتوليد وطباعة الباركود ---------- */
function vStock(){
 $('#main').innerHTML='<div class="acts" style="margin-top:0"><button class="btn own" onclick="fProd()">+ صنف جديد</button></div><input id="f" placeholder="فلترة بالاسم أو الباركود" style="margin-top:10px"><div id="list" style="margin-top:10px"></div>';
 $('#f').oninput=sList;sList()}

function sList(){var v=$('#f').value.trim().toLowerCase(),L=S.products.filter(function(p){return p.name.toLowerCase().indexOf(v)>-1||(p.code||'').toLowerCase().indexOf(v)>-1});
 var isCash=isEffectiveCashier();
 $('#list').innerHTML=L.length?L.map(function(p){var low=p.qty<=p.min,d=days(p);
  return '<div class="row"><div class="g"><b>'+esc(p.name)+'</b><span class="mut">بيع: '+money(p.price)+(!isCash&&p.cost>0?' · شراء: '+money(p.cost):'')+(p.code?' · كود: '+esc(p.code):'')+(p.exp?' · صلاحية '+p.exp:'')+'</span><br><span class="tag '+(p.qty<=0?'t-err':low?'t-warn':'t-ok')+'">'+fmt(p,p.qty)+'</span>'+(d!==null&&d<=90?' <span class="tag '+(d<0?'t-err':'t-warn')+'">'+(d<0?'منتهي':d+' يوم')+'</span>':'')+'</div>'
  +'<button class="btn sec sm own" onclick="fBarcode('+p.id+')" title="طباعة استيكر باركود">🏷️ باركود</button>'
  +'<button class="btn sm own" onclick="fRestock('+p.id+')">توريد</button>'
  +'<button class="btn sec sm own" onclick="del('+p.id+')" aria-label="حذف">حذف</button></div>'}).join(''):'<div class="empty">'+(S.products.length?'مفيش نتايج.':'لسه مفيش أصناف. اضغط صنف جديد.')+'</div>'}

function genCode(){
 var c=String(Math.floor(10000000+Math.random()*90000000));
 $('#c').value=c;
 toast('تم توليد كود باركود: '+c);
}

function fProd(){var d=$('#dlg');
 d.innerHTML='<form onsubmit="return addP(event)"><h2 style="margin-top:0">صنف جديد</h2><label>الاسم</label><input id="n" required>'
 +'<label>الباركود (امسحه أو ولّده تلقائياً)</label><div style="display:flex;gap:8px"><input id="c" placeholder="رقم الباركود"><button type="button" class="btn sec sm" onclick="genCode()" style="white-space:nowrap">✨ توليد كود</button></div>'
 +'<div class="two"><div><label>سعر البيع '+(ph()?'(للعلبة)':'(للقطعة)')+'</label><input id="p" type="number" step="0.01" min="0" required></div><div><label>سعر الشراء / التكلفة</label><input id="cost" type="number" step="0.01" min="0" value="0"></div></div>'
 +'<div class="two"><div><label>الكمية الحالية'+(ph()?' (علب)':'')+'</label><input id="q2" type="number" min="0" value="0" required></div><div><label>حد إعادة الطلب'+(ph()?' (علب)':'')+'</label><input id="m" type="number" min="0" value="3" required></div></div>'
 +(ph()?'<div class="two"><div><label>عدد الأشرطة في العلبة</label><input id="s" type="number" min="1" value="1" required></div><div><label>تاريخ الصلاحية</label><input id="e" type="date"></div></div>':'')
 +'<div class="acts"><button class="btn" type="submit">حفظ الصنف</button><button class="btn sec" type="button" onclick="$(\'#dlg\').close()">إلغاء</button></div></form>';d.showModal()}

async function fBarcode(id){
 var p=P(id);
 if(!p.code){
  if(!confirm('الصنف ده ملوش باركود مسجل. تحب نولد له كود تلقائي ونحفظه دلوقتي؟'))return;
  var newCode=String(Math.floor(10000000+Math.random()*90000000));
  var r=await DB.from('products').update({code:newCode}).eq('id',p.uid);
  if(r.error)return toast(msg(r.error));
  p.code=newCode;
  sList();
 }
 var defCount=Math.max(1,Math.floor(p.qty/(p.spb||1))||1);
 var d=$('#dlg');
 d.innerHTML='<div class="noprint"><h2 style="margin-top:0">طباعة باركود: '+esc(p.name)+'</h2>'
  +'<label>عدد الاستيكرات المطلوب طباعتها</label>'
  +'<div style="display:flex;gap:8px"><input id="bc_cnt" type="number" min="1" max="200" value="'+defCount+'" oninput="drawLabels('+id+')"><button class="btn" onclick="window.print()">🖨️ طباعة الآن</button></div>'
  +'<div class="acts" style="margin-top:10px"><button class="btn sec" onclick="$(\'#dlg\').close()">إغلاق</button></div></div>'
  +'<div id="bc_area" class="bc-grid"></div>';
 d.showModal();
 drawLabels(id);
}

function drawLabels(id){
 var p=P(id),cnt=Math.min(200,Math.max(1,+$('#bc_cnt').value||1));
 var area=$('#bc_area'),html='';
 for(var i=0;i<cnt;i++){
  html+='<div class="bc-label"><div class="b-shop">'+esc(S.shop||'')+'</div><div class="b-name">'+esc(p.name)+'</div><svg class="bc-svg" jsbarcode-value="'+esc(p.code)+'"></svg><div class="b-price">'+money(p.price)+'</div></div>';
 }
 area.innerHTML=html;
 if(window.JsBarcode){
  try{
   JsBarcode(".bc-svg",{format:"CODE128",width:1.6,height:32,displayValue:true,fontSize:11,margin:0});
  }catch(e){toast('الكود غير صالح للرسم، جرب توليد كود أرقام فقط')}
 }
}

async function addP(e){e.preventDefault();var s=ph()?Math.max(1,+$('#s').value||1):1;
 var r=await DB.from('products').insert({shop_id:SID,name:$('#n').value.trim(),code:$('#c').value.trim()||null,price:+$('#p').value,cost_price:+($('#cost').value||0),qty:Math.round(+$('#q2').value*s),min_qty:Math.round(+$('#m').value*s),units_per_box:s,expiry:ph()&&$('#e').value?$('#e').value:null});
 if(r.error){toast(msg(r.error));return false}
 $('#dlg').close();toast('تمت إضافة الصنف');await load();render();return false}
function fRestock(id){var p=P(id),d=$('#dlg');
 d.innerHTML='<form onsubmit="return restock(event,'+id+')"><h2 style="margin-top:0">توريد: '+esc(p.name)+'</h2><label>الكمية المشتراة'+(p.spb>1?' (علب)':'')+'</label><input id="rq" type="number" min="1" required>'+(ph()?'<label>تاريخ صلاحية الدفعة الجديدة</label><input id="re" type="date" value="'+(p.exp||'')+'">':'')
 +'<div class="acts"><button class="btn" type="submit">إضافة للمخزون</button><button class="btn sec" type="button" onclick="$(\'#dlg\').close()">إلغاء</button></div></form>';d.showModal()}
async function restock(e,id){e.preventDefault();var p=P(id),u={qty:p.qty+Math.round(+$('#rq').value*(p.spb||1))};if(ph()&&$('#re').value)u.expiry=$('#re').value;
 var r=await DB.from('products').update(u).eq('id',p.uid);
 if(r.error){toast(msg(r.error));return false}
 $('#dlg').close();toast('تمت إضافة الكمية');await load();render();return false}
async function del(id){if(!confirm('حذف الصنف ده نهائياً؟'))return;var r=await DB.from('products').delete().eq('id',P(id).uid);if(r.error)toast(msg(r.error));else{await load();render()}}

/* ---------- تنبيهات ---------- */
function vAlerts(){var a=alerts();
 $('#main').innerHTML='<h2 style="margin-top:0">محتاج انتباه</h2>'+(a.length?a.map(function(x){return '<div class="row"><div class="g"><b>'+esc(x.p.name)+'</b><span class="tag t-'+x.k+'">'+x.t+'</span></div><button class="btn sm own" onclick="fRestock('+x.p.id+')">توريد</button></div>'}).join(''):'<div class="empty">كله تمام. مفيش نواقص ولا صلاحيات قربت تخلص.</div>')}

/* ---------- تقارير والأرباح الفعلية ---------- */
function vRep(){var t0=new Date();t0.setHours(0,0,0,0);
 var td=S.sales.filter(function(s){return s.t>=t0.getTime()});
 var sumSales=td.reduce(function(a,s){return a+s.tot-(s.refunded||0)},0);
 
 // حساب تكلفة البضاعة المباعة اليوم
 var totalCostToday=0;
 td.forEach(function(s){
  s.items.forEach(function(it){
   var netQty=it.q-(it.rt||0);
   if(netQty>0){
    var prod=S.products.find(function(x){return x.uid===it.pid});
    if(prod && prod.cost>0){
     var unitCost=it.u==='strip'?(prod.cost/(prod.spb||1)):prod.cost;
     totalCostToday+=unitCost*netQty;
    }
   }
  });
 });

 var tdExp=S.expenses.filter(function(e){return new Date(e.created_at).getTime()>=t0.getTime()}),sumExp=tdExp.reduce(function(a,e){return a+ (+e.amount)},0);
 var netProfit=sumSales-totalCostToday-sumExp;
 var top=S.products.filter(function(p){return p.sold>0}).sort(function(a,b){return b.sold-a.sold}).slice(0,5);
 var st=S.products.filter(function(p){return p.qty>0&&Date.now()-(p.last||p.c)>30*864e5});
 var val=S.products.reduce(function(a,p){return a+p.price*p.qty/(p.spb||1)},0);
 
 $('#main').innerHTML='<div class="stat"><div><span class="mut">مبيعات اليوم</span><b>'+money(sumSales)+'</b>'+td.length+' فاتورة</div><div class="own"><span class="mut">مصروفات اليوم</span><b style="color:var(--err)">'+money(sumExp)+'</b>'+tdExp.length+' مصروف</div></div>'
 +'<div class="stat own" style="margin-top:10px"><div><span class="mut">صافي الربح الفعلي اليوم</span><b style="color:var(--ok)">'+money(netProfit)+'</b>بعد خصم التكلفة والمصروفات</div><div><span class="mut">قيمة المخزون</span><b>'+money(val)+'</b>بسعر البيع</div></div>'
 +'<div class="acts own"><button class="btn sec" onclick="fExpense()">+ تسجيل مصروف</button></div>'
 +'<h2>الأكثر مبيعاً</h2>'+(top.length?top.map(function(p){return '<div class="row"><b class="g">'+esc(p.name)+'</b><span class="mut">'+fmt(p,p.sold)+'</span></div>'}).join(''):'<div class="empty">لسه مفيش مبيعات.</div>')
 +'<h2>راكد (من غير بيع 30 يوم)</h2>'+(st.length?st.map(function(p){return '<div class="row"><b class="g">'+esc(p.name)+'</b><span class="mut">'+fmt(p,p.qty)+'</span></div>'}).join(''):'<div class="empty">مفيش أصناف راكدة.</div>')}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
boot();
